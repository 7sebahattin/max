name: MAX co-enabled acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
# Serialize by source branch, including manual runs; retain running cleanup.
# GitHub keeps only the newest pending run in this group.
concurrency:
  group: max-coenabled-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  select-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.selection.outputs.required }}
      base: ${{ steps.selection.outputs.base }}
      comparison_base: ${{ steps.selection.outputs.comparison_base }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Lightweight trigger/provenance tests (no Docker)
        run: python3 -m unittest discover -s tests/coenabled -p test_ci_policy.py -v
      - name: Select from complete Git diff (including deletions and renames)
        id: selection
        run: python3 tests/coenabled/regression_policy.py
  single-populated-installation:
    needs: select-regression
    if: needs.select-regression.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COENABLED_BASE_SHA: ${{ needs.select-regression.outputs.base }}
      COMPOSE_PROJECT_NAME: max-coenabled-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source, repository policy and safe assertion tests
        run: |
          git rev-parse HEAD
          python3 scripts/check.py
          python3 scripts/max_source_audit.py --json
          python3 -m compileall -q tests/coenabled
          bash -n scripts/coenabled_test.sh
          find tests/coenabled -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m unittest discover -s tests/coenabled -v
      - name: Generated disposable credentials and browser
        run: |
          python3 - <<'PYENV'
          from pathlib import Path
          import secrets
          env=Path('.env')
          env.write_text('MARIADB_DATABASE=max_demo\nMARIADB_USER=max_demo\nMARIADB_PASSWORD='+secrets.token_hex(24)+'\nMARIADB_ROOT_PASSWORD='+secrets.token_hex(24)+'\n')
          env.chmod(0o600)
          PYENV
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Enable Chromium user namespace sandbox for this job
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            value="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            echo "MAX_COENABLED_APPARMOR_USERNS=$value" >> "$GITHUB_ENV"
            if [ "$value" = 1 ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            value="$(cat /proc/sys/kernel/unprivileged_userns_clone)"
            echo "MAX_COENABLED_USERNS_CLONE=$value" >> "$GITHUB_ENV"
            if [ "$value" = 0 ]; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          fi
          if [ -e /proc/sys/user/max_user_namespaces ]; then
            value="$(cat /proc/sys/user/max_user_namespaces)"
            echo "MAX_COENABLED_USERNS_LIMIT=$value" >> "$GITHUB_ENV"
            if [ "$value" = 0 ]; then sudo sysctl -w user.max_user_namespaces=15000; fi
          fi
          unshare --user --map-root-user true
      - name: ONE native installation and shared DB for all five enabled modules
        run: bash scripts/coenabled_test.sh
      - name: Restore runner user namespace policy
        if: always()
        run: |
          if [ -n "${MAX_COENABLED_APPARMOR_USERNS:-}" ]; then sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$MAX_COENABLED_APPARMOR_USERNS"; fi
          if [ -n "${MAX_COENABLED_USERNS_CLONE:-}" ]; then sudo sysctl -w "kernel.unprivileged_userns_clone=$MAX_COENABLED_USERNS_CLONE"; fi
          if [ -n "${MAX_COENABLED_USERNS_LIMIT:-}" ]; then sudo sysctl -w "user.max_user_namespaces=$MAX_COENABLED_USERNS_LIMIT"; fi
      - name: Sanitized evidence including failures and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-coenabled-evidence
          path: .local/coenabled-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
