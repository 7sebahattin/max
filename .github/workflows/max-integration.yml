name: MAX integration regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: max-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Integrated safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Developer doctor regression tests
        run: python -m unittest discover -s tests -p test_dev_doctor.py -v
      - name: Source audit adversarial tests
        run: python -m unittest discover -s tests -p test_max_source_audit.py -v
      - name: Integration isolation and failure propagation tests
        run: python -m unittest discover -s tests/integration -p test_*.py -v
      - name: MAX Core overflow and denied-content assertion regressions
        run: python -m unittest discover -s tests/maxcore -p test_browser_assertions.py -v
      - name: Strict source audit of the combined index
        run: python scripts/max_source_audit.py
      - name: Repository policy
        run: python scripts/check.py
      - name: Module invariants and Python compilation
        run: |
          python tests/maxcore/static.py
          python -m compileall -q scripts tests
      - name: Shell syntax (Linux)
        if: runner.os == 'Linux'
        run: bash -n scripts/smoke.sh scripts/p2_install.sh scripts/maxcore_test.sh

  native:
    name: Native integration (${{ matrix.pilot }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        pilot: [p2, maxcore]
    # Separate fresh VMs: never concurrent installs in one runner.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Fresh native install, pilot, evidence and owned-volume cleanup
        run: python tests/integration/run.py --pilot ${{ matrix.pilot }}
      - name: Preserve explicitly allowed synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-${{ matrix.pilot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/integration-${{ matrix.pilot }}.json
            .local/p2-browser.json
            .local/p2-*.png
            .local/maxcore-mobile.json
            .local/maxcore-*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Combined integration acceptance
    if: always()
    needs: [portable, native]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both complete matrices
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          from pathlib import Path
          results = {key: os.environ[key] for key in ('PORTABLE_RESULT', 'NATIVE_RESULT')}
          text = 'Tested commit: ' + os.environ['TESTED_COMMIT'] + '\n\n'
          text += '\n'.join(key + ': ' + value for key, value in results.items()) + '\n'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(text)
          assert all(value == 'success' for value in results.values()), 'Integration matrices did not both pass'
