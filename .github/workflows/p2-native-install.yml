name: P2 native Dolibarr installation

on:
  pull_request:
    paths:
      - '.github/workflows/p2-native-install.yml'
      - 'scripts/p2_install.sh'
      - 'scripts/prepare.py'
      - 'scripts/check.py'
      - 'tests/p2_*'
      - 'deployment/local/**'
      - 'compose.yaml'
      - 'upstream.lock.json'

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate disposable DB credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          p = Path('.env')
          p.write_text('MARIADB_DATABASE=max_demo\nMARIADB_USER=max_demo\nMARIADB_PASSWORD='+secrets.token_hex(24)+'\nMARIADB_ROOT_PASSWORD='+secrets.token_hex(24)+'\n')
          p.chmod(0o600)
          PY
      - name: Install browser test tooling
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Install real Dolibarr schema and demo administrator
        shell: bash
        run: P2_BROWSER=1 bash scripts/p2_install.sh
      - name: Stop isolated containers
        if: always()
        run: docker compose down
