name: Developer doctor
on:
  pull_request:
    paths:
      - docs/DEVELOPER_WINDOWS.md
      - scripts/dev_doctor.py
      - tests/test_dev_doctor.py
      - .github/workflows/dev-doctor.yml
permissions:
  contents: read
concurrency:
  group: dev-doctor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-tests:
    name: Doctor tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Portable safety and diagnostic tests
        run: python -m unittest discover -s tests -p test_dev_doctor.py -v
      - name: Compile the owned Python files
        run: python -m py_compile scripts/dev_doctor.py tests/test_dev_doctor.py
      - name: Validate real diagnostic report without claiming runner readiness
        shell: python
        run: |
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'scripts/dev_doctor.py', '--json'], capture_output=True, text=True, timeout=45)
          report = json.loads(result.stdout)
          assert result.returncode in (0, 1), 'Unexpected doctor exit code'
          assert report['schema_version'] == 1
          assert report['failed'] == any(c['status'] == 'fail' for c in report['checks'])
          assert result.returncode == int(report['failed'])
          print(json.dumps(report, indent=2))
          print('Report contract verified; workstation prerequisites may still need action.')
