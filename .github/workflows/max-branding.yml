name: Global product branding
on:
  pull_request:
    paths:
      - 'modules/maxcore/**'
      - 'tests/branding/**'
      - 'scripts/branding_*'
      - 'docs/BRAND_COVERAGE.md'
      - '.github/workflows/max-branding.yml'
permissions:
  contents: read
jobs:
  isolated-brand:
    name: Isolated brand (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b]
    env:
      BRANDING_VARIANT: ${{ matrix.variant }}
      COMPOSE_PROJECT_NAME: max-branding-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Policy, source audit and original assertions
        run: |
          python scripts/check.py
          python scripts/max_source_audit.py
          python tests/maxcore/static.py
          python -m unittest discover -s tests/maxcore -p test_browser_assertions.py -v
          python -m compileall -q tests/branding
          bash -n scripts/branding_test.sh
      - name: Fresh credentials and browser
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          p=Path('.env')
          p.write_text('MARIADB_DATABASE=max_demo\nMARIADB_USER=max_demo\nMARIADB_PASSWORD='+secrets.token_hex(24)+'\nMARIADB_ROOT_PASSWORD='+secrets.token_hex(24)+'\n')
          p.chmod(0o600)
          PY
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Original MAX Core plus real branding HTTP tests
        run: bash scripts/branding_test.sh
      - name: Synthetic screenshots and allowlisted report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branding-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            .local/branding-*.png
            .local/branding-${{ matrix.variant }}-report.json
            .local/maxcore-*.png
            .local/maxcore-mobile.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this isolated demo project's resources
        if: always()
        run: docker compose down --volumes --remove-orphans
